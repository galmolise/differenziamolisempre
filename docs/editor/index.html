<!DOCTYPE html>
<html lang="it">
<head>

</head>

    <aside class="sidebar" id="sidebar" aria-label="Sezioni editor">

          </div>
          <div class="brand-subtitle">Editor contenuti · versione 1.2</div>
        </div>
      </div>
      <div class="municipality">
        <span class="eyebrow">COMUNE ATTIVO</span>
        <select id="city-select" class="city-select" aria-label="Comune da modificare"><option value="pietracatella">Pietracatella</option></select>
        <span class="municipality-caption" id="municipality-caption">Molise · CB</span>
      </div>
      <div class="nav-label">CONTENUTI</div>
      <nav id="navigation" class="navigation">
        <button class="nav-link active" data-section="panoramica"><span class="nav-emoji" aria-hidden="true">▦</span><span>Panoramica</span></button>
        <button class="nav-link" data-section="calendario"><span class="nav-emoji" aria-hidden="true">▣</span><span>Calendario</span></button>
        <button class="nav-link" data-section="dizionario"><span class="nav-emoji" aria-hidden="true">▤</span><span>Dizionario</span><span class="nav-count" id="nav-dictionary">438</span></button>
        <button class="nav-link" data-section="guida"><span class="nav-emoji" aria-hidden="true">▧</span><span>Guida</span></button>
        <button class="nav-link" data-section="consigli"><span class="nav-emoji" aria-hidden="true">✦</span><span>Consigli utili</span></button>
        <button class="nav-link" data-section="servizi"><span class="nav-emoji" aria-hidden="true">⌂</span><span>Servizi comunali</span></button>
        <button class="nav-link" data-section="riconoscimento"><span class="nav-emoji" aria-hidden="true">◉</span><span>Riconoscimento</span></button>
      </nav>
      <div class="nav-label">STRUMENTI</div>
      <nav class="navigation">
        <button class="nav-link" data-section="avanzate"><span class="nav-emoji" aria-hidden="true">⚙</span><span>Campi avanzati</span></button>
        <button class="nav-link" data-section="controlli"><span class="nav-emoji" aria-hidden="true">✓</span><span>Validazione</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="dot"></div><span>Funziona nel browser · nessun account richiesto</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="menu-button" class="icon-button mobile-menu" aria-label="Mostra navigazione">☰</button>
        <div class="breadcrumbs"><span id="breadcrumb-city">Pietracatella</span><span class="breadcrumb-sep">/</span><strong id="breadcrumb-current">Panoramica</strong></div>
        <div class="topbar-actions">
          <span id="dirty-indicator" class="state-chip">Nessuna modifica</span>
          <button id="undo-button" class="button button-quiet" title="Annulla ultima modifica" disabled>↶ <span class="desktop-label">Annulla</span></button>
          <button id="redo-button" class="button button-quiet" title="Ripristina modifica" disabled>↷ <span class="desktop-label">Ripristina</span></button>
        </div>
      </header>
      <div id="alert-area" class="alert-area" role="status" aria-live="polite"></div>
      <main id="main" class="main"></main>
      <footer class="footer"><span>Editor statico · Le modifiche restano nel browser finché non esporti il file</span><span id="footer-revision">schema 3</span></footer>
    </div>
  </div>
  <dialog id="confirmation-dialog" class="confirm-dialog" aria-labelledby="dialog-title">
    <form method="dialog"><h2 id="dialog-title">Conferma</h2><p id="dialog-message"></p><div class="dialog-actions"><button value="cancel" class="button button-secondary">Annulla</button><button value="confirm" class="button button-danger">Conferma</button></div></form>
  </dialog>
  <input type="file" accept=".json,application/json" id="file-input" hidden>
</body>
</html>
